name: Publicar Controle de Chaparia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aguardar publicação nativa do GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, branch: 'main', per_page: 30
              });
              const pending = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' && run.status !== 'completed'
              );
              if (!pending.length) return;
              core.info('Aguardando a publicação nativa para publicar o build compilado por último.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('A publicação nativa ainda está pendente. Reexecute este deploy após sua conclusão.');
      - uses: actions/deploy-pages@v4
        id: deployment
